[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61.0",
  "setuptools-scm[toml]>=3.4",
  "wheel",
]

[project]
name = "cruiseplan"
description = "Oceanographic Research Cruise Planning System"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

# Version is derived from git tags by setuptools-scm.
dynamic = ["version"]

dependencies = [
  "numpy>=2.0.2",
  "pandas>=2.3.3",
  "xarray>=2024.7.0",
  "netCDF4>=1.7.2",
  "scipy>=1.13.1",
  "requests>=2.32.5",
  "pangaeapy>=1.0.22",
  "pydantic>=2.13.4",
  "ruamel.yaml>=0.19.1,<0.20.0",
  "matplotlib>=3.9.4",
  "folium",
  "branca",
  "geopandas>=1.0.1",
  "tqdm>=4.67.3",
  "jinja2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
]
dev = [
  "cruiseplan[test]",
  "jupyterlab>=4.5.8",
  "nbconvert>=7.17.1",
  "myst-nb>=1.3.0",
  "nbsphinx>=0.9.8",
  "sphinx>=7.4.7",
  "sphinx-rtd-theme>=3.1.0",
  "pypandoc>=1.17",
  "myst-parser>=3.0.1",
  "mock",
  "black>=26.5.1",
  "ruff>=0.15.20",
  "pre-commit>=4.3.0",
  "codespell",
  "mypy>=1.19.1",
  "types-requests",
  "types-tqdm",
  "pandas-stubs",
]

# THIS ENABLES THE 'cruiseplan' TERMINAL COMMAND
[project.scripts]
cruiseplan = "cruiseplan.cli.main:main"

[project.urls]
documentation = "https://github.com/ocean-uhh/cruiseplan"
homepage = "https://github.com/ocean-uhh/cruiseplan"
repository = "https://github.com/ocean-uhh/cruiseplan"


# ---------------------------------------------------------
# TOOL CONFIGURATION
# ---------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["cruiseplan*"]

[tool.setuptools_scm]
write_to = "cruiseplan/_version.py"
write_to_template = "__version__ = '{version}'"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs/legacy", "docs/source/legacy"]  # archived docs, not maintained

[tool.ruff.lint]
select = [
  "E",       # pycodestyle errors
  "F",       # pyflakes
  "W",       # pycodestyle warnings
  "B",       # flake8-bugbear
  "BLE",     # flake8-blind-except
  "ARG",     # flake8-unused-arguments
  "D",       # pydocstyle
  "ANN",     # flake8-annotations
  "I",       # isort
  "UP",      # pyupgrade
  "C4",      # flake8-comprehensions
  "RET",     # flake8-return
  "PIE",     # flake8-pie
  "SIM",     # flake8-simplify
  "NPY",     # numpy-specific rules
  "PTH",     # flake8-use-pathlib
  "RUF100",  # unused noqa
]
ignore = [
  "E501",    # line length: the formatter handles it
  "C901",    # complexity: not enforced
]
extend-select = [
  "D417",    # numpy convention drops D417; it is the check that params are documented
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "ANN", "D"]  # tests are not public API; pytest fixtures look unused
"**/*.ipynb" = ["B018"]          # notebooks display bare expressions

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Legacy code compatibility, tighten gradually
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
# Additional strictness for better type checking
disallow_any_generics = true
warn_no_return = true
strict_optional = true

# Scientific computing packages often lack good type stubs
[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "folium.*", 
    "pangaeapy.*",
    "branca.*",
    "netCDF4.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--verbose --cov=cruiseplan --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
filterwarnings = [
    # Package code and tests read records by attribute; only the deprecation
    # test reads them like a dictionary (it expects the warning).
    "error:ActivityRecord\\[:DeprecationWarning",
]

[tool.coverage.run]
source = ["cruiseplan"]
omit = ["cruiseplan/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
